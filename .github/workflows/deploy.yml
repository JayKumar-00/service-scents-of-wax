name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: giftfactory-api
  ECS_CLUSTER: giftfactory-cluster

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && 'production' || 'development' }})
    runs-on: ubuntu-latest

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'prod-latest' || 'dev-latest' }}
      ECS_SERVICE: ${{ github.ref == 'refs/heads/main' && 'giftfactory-api-production' || 'giftfactory-api-development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image (${{ env.IMAGE_TAG }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-${{ github.sha }}

      - name: Deploy ECS with rollback on failure
        run: |
          set -euo pipefail
          SVC="${ECS_SERVICE}"

          PREV_TD=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${SVC}" \
            --region "${AWS_REGION}" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "Saved ${SVC} task definition: ${PREV_TD}"

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${SVC}" \
            --force-new-deployment \
            --region "${AWS_REGION}" \
            --no-cli-pager

          if aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${SVC}" \
            --region "${AWS_REGION}"; then
            echo "ECS deployment stable (${DEPLOY_ENV})."
            exit 0
          fi

          echo "ECS deployment failed — rolling back ${SVC}..."
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${SVC}" \
            --task-definition "${PREV_TD}" \
            --force-new-deployment \
            --region "${AWS_REGION}" \
            --no-cli-pager

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${SVC}" \
            --region "${AWS_REGION}" || true

          echo "Rollback complete. Failing workflow because deploy did not stabilize."
          exit 1
